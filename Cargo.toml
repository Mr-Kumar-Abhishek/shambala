[package]
name = "shambala"
version = "0.2.0"
edition = "2021"

[dependencies]
# ECS
bevy_ecs = "0.14"
bevy_app = "0.14"
bevy_math = "0.14"

# Rendering
wgpu = "22.0"
winit = "0.30"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"

# Procedural generation
noise = "0.8"
rand = "0.8"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"
bytemuck = { version = "1.0", features = ["derive"] }

# Timing
instant = "0.1"

# Image loading
image = "0.25"

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
mockall = "0.13"

[[bench]]
name = "render_benchmarks"
harness = false

[[bench]]
name = "physics_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
