<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a86ff"/>
      <stop offset="100%" stop-color="#1a4fa0"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2d42"/>
      <stop offset="100%" stop-color="#1a1b2e"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="32" cy="60" rx="12" ry="3" fill="rgba(0,0,0,0.2)"/>
  <!-- Legs -->
  <rect x="24" y="44" width="6" height="14" rx="2" fill="url(#pants)"/>
  <rect x="34" y="44" width="6" height="14" rx="2" fill="url(#pants)"/>
  <!-- Boots -->
  <rect x="23" y="54" width="8" height="5" rx="2" fill="#4a4e69"/>
  <rect x="33" y="54" width="8" height="5" rx="2" fill="#4a4e69"/>
  <!-- Body/torso -->
  <rect x="20" y="24" width="24" height="22" rx="4" fill="url(#body)"/>
  <!-- Belt -->
  <rect x="20" y="42" width="24" height="4" rx="1" fill="#1a1b2e"/>
  <!-- Arms -->
  <rect x="14" y="26" width="7" height="18" rx="3" fill="url(#body)"/>
  <rect x="43" y="26" width="7" height="18" rx="3" fill="url(#body)"/>
  <!-- Hands -->
  <circle cx="17" cy="46" r="3" fill="#f5cba7"/>
  <circle cx="47" cy="46" r="3" fill="#f5cba7"/>
  <!-- Twin Blades -->
  <rect x="8" y="18" width="3" height="30" rx="1.5" fill="#c0c0c0" transform="rotate(-15, 10, 33)"/>
  <rect x="52" y="18" width="3" height="30" rx="1.5" fill="#c0c0c0" transform="rotate(15, 54, 33)"/>
  <rect x="6" y="14" width="7" height="6" rx="1" fill="#8b4513" transform="rotate(-15, 10, 33)"/>
  <rect x="50" y="14" width="7" height="6" rx="1" fill="#8b4513" transform="rotate(15, 54, 33)"/>
  <!-- Head -->
  <circle cx="32" cy="17" r="11" fill="#f5cba7"/>
  <!-- Hair -->
  <path d="M21 15 Q26 4 32 5 Q38 4 43 15 Q40 8 32 7 Q24 8 21 15Z" fill="#4a3000"/>
  <path d="M21 15 Q23 11 32 10 Q41 11 43 15 Q40 12 32 11 Q24 12 21 15Z" fill="#5c3a10"/>
  <!-- Eyes -->
  <circle cx="27" cy="16" r="2" fill="white"/>
  <circle cx="37" cy="16" r="2" fill="white"/>
  <circle cx="27" cy="16" r="1.2" fill="#2b2d42"/>
  <circle cx="37" cy="16" r="1.2" fill="#2b2d42"/>
  <!-- Mouth -->
  <path d="M28 21 Q32 23 36 21" stroke="#c0392b" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Headband -->
  <rect x="21" y="10" width="22" height="3" rx="1" fill="#e63946"/>
</svg>
